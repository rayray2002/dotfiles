# Build every machine's configuration on each push to main and on pull
# requests. Pushes made by the workflows themselves don't trigger this, so
# those workflows build before pushing.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # x86_64-linux hosts, the aarch64 Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - run: scripts/ci-build
